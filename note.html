<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="note-page">

    <header class="note-header">

        <p class="note-subtitle">
            PERSONAL ARCHIVE / NOTES
        </p>

        <h1>NOTE</h1>

        <div class="note-line"></div>

        <p class="note-description">
            思ったことを、気軽に。
        </p>

    </header>


    <!-- 投稿フォーム -->

    <section class="note-form">

        <textarea
            id="noteInput"
            placeholder="いま考えていること……"
        ></textarea>

        <button type="button" onclick="addNote()">
            POST
        </button>

    </section>


    <!-- 投稿一覧 -->

    <section id="noteList" class="note-list">
    </section>


    <!-- 下部メニュー -->

    <nav class="global-menu">
    <a href="index.html">TOP</a>
    <a href="about.html">ABOUT</a>
    <a href="text.html">NOVEL</a>
    <a href="illustration.html">ILLUSTRATION</a>
    <a href="log.html">OTHER</a>
</nav>


</main>


<script>

function addNote() {

    const input = document.getElementById("noteInput");

    const text = input.value.trim();

    // 空欄なら投稿しない
    if (text === "") {
        return;
    }


    // 保存されている投稿を取得
    const notes =
        JSON.parse(localStorage.getItem("myNotes")) || [];


    // 今日の日付
    const now = new Date();

    const date =
        now.getFullYear() + "." +
        String(now.getMonth() + 1).padStart(2, "0") + "." +
        String(now.getDate()).padStart(2, "0");


    // 新しい投稿を一番上に追加
    notes.unshift({

        date: date,

        text: text

    });


    // 保存
    localStorage.setItem(
        "myNotes",
        JSON.stringify(notes)
    );


    // 入力欄を空にする
    input.value = "";


    // 投稿を表示
    displayNotes();

}


function displayNotes() {

    const list =
        document.getElementById("noteList");

    const notes =
        JSON.parse(localStorage.getItem("myNotes")) || [];

    list.innerHTML = "";

    notes.forEach((note, index) => {

        const article =
            document.createElement("article");

        article.className = "note-post";

        article.innerHTML = `
            <div class="note-post-date">
                ${note.date}
            </div>

            <div class="note-post-text">
                ${note.text.replace(/\n/g, "<br>")}
            </div>

            <button
                class="note-delete"
                onclick="deleteNote(${index})">
                DELETE
            </button>
        `;

        list.appendChild(article);

    });

}

// ページを開いたときに保存済み投稿を表示
displayNotes();

function deleteNote(index) {

    const notes =
        JSON.parse(localStorage.getItem("myNotes")) || [];

    notes.splice(index, 1);

    localStorage.setItem(
        "myNotes",
        JSON.stringify(notes)
    );

    displayNotes();
}

</script>

</body>
</html>
